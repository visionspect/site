# VisionSpect Solutions — Netlify settings
# Static site: no build step. Netlify publishes this folder as-is.

[build]
  publish = "."
  # Skip a production deploy (and its credits) when only docs or repo files changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)README.md' ':(exclude)CLAUDE.md' ':(exclude).github/'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/thanks.html"
  [headers.values]
    X-Robots-Tag = "noindex"

# Old Squarespace URLs -> sections of the new single page
[[redirects]]
  from = "/services"
  to = "/#services"
  status = 301

[[redirects]]
  from = "/our-services"
  to = "/#services"
  status = 301

[[redirects]]
  from = "/integration"
  to = "/#services"
  status = 301

[[redirects]]
  from = "/aboutus"
  to = "/#about"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 301

[[redirects]]
  from = "/cart"
  to = "/"
  status = 301
